# Example operator configuration. Loaded ONLY with --config config.toml.
# Root values MUST precede TOML tables. Relative workspace paths anchor to this file.
workspace_dir = "."

[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen2.5-coder:7b"
temperature = 0.2
context_length = 16384
timeout = 120 # seconds
allow_remote = false

[models]
# Empty strings inherit ollama.model. Set any role to a separately installed local model.
planner = ""
coder = ""
reviewer = ""

[agent]
max_iterations = 6
max_cycles = 2
max_tool_calls = 64
max_context_chars = 100000
max_task_chars = 16000

[checks.tests]
cmd = [".venv/bin/python", "-m", "pytest", "-q"]
timeout = 120000 # milliseconds
required = true
kind = "test"
filetypes = ["python"]

[checks.lint]
cmd = [".venv/bin/ruff", "check", "flow", "tests"]
timeout = 30000
required = true
kind = "lint"
filetypes = ["python"]
