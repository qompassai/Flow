[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow"
version = "0.2.0"
description = "Local AI Workflow System — Amor Fati Labs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amor Fati Labs", email = "matt@aflabs.io"}]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
editor = ["pynvim>=0.5,<0.7"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "hatchling>=1.25"]

[project.scripts]
flow = "flow.main:main"

[tool.hatch.build.targets.wheel]
packages = ["flow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
