[package]
name = "phlow-cli"
version = "0.1.0"
edition = "2024"

# Two entrypoints share one implementation: `phlow` (primary) and `flow`
# (the legacy compatibility alias). Autodiscovery maps each of
# src/bin/phlow.rs and src/bin/flow.rs to a binary of the same name; both
# are thin shims calling phlow_cli::run(), so no behavior is duplicated.
# The shared logic lives in src/lib.rs alongside cli/wiring/signal.
[dependencies]
# clap 4 (derive): CLI surface parity with Python's argparse — global flags
# accepted before or after the subcommand (argparse `parents=[common]`
# becomes `global = true`), subcommand help, exit code 2 on usage errors.
# Derive is chosen over the builder API so flag wiring is compile-checked;
# `--version` is a manual flag because the required string is exactly
# "Flow 0.2.0", not clap's "{bin} {version}" rendering.
clap = { version = "4", features = ["derive"] }
# signal-hook 0.3: SIGTERM watcher thread (self-pipe based, no async
# runtime needed) mapping SIGTERM to exit 130 like Python's
# SIGTERM->KeyboardInterrupt handler. Already in the lockfile (0.3.18)
# via mio, so no new packages enter the tree.
signal-hook = "0.3"
# serde_json: report values; serialization itself goes through
# phlow_tools::python_json_dumps for byte-parity with Python's json.dumps.
serde_json = "1"
phlow-config = { path = "../phlow-config" }
phlow-editor = { path = "../phlow-editor" }
phlow-mcp = { path = "../phlow-mcp" }
phlow-runtime = { path = "../phlow-runtime" }
phlow-tools = { path = "../phlow-tools" }
phlow-tui = { path = "../phlow-tui" }
